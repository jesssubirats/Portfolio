  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"display:flex;flex-direction:column;gap:0;background:#ffffff;outline:1px solid #e2e8f0;text-decoration:none;color:inherit\" style-hover=\"outline:2px solid oklch(0.45 0.09 200)\">\n<img src=\"0a1251f9-8f04-44e2-addf-79c1a6bf7486\" alt=\"Co-marketing patient page template\" style=\"width:100%;height:150px;object-fit:cover;object-position:top center;display:block;border-bottom:1px solid #e2e8f0\">\n<span style=\"padding:12px 14px 4px;font-size:14px;font-weight:700;color:#152029;line-height:1.3\">Co-marketing template<\u002Fspan>\n<span style=\"padding:0 14px 13px;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#94a3b8\">External · EN + ES<\u002Fspan>\n<\u002Fa>\n<a href=\"https://jesssubirats.github.io/ABA-referrals/\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;flex-direction:column;gap:0;background:#ffffff;outline:1px solid #e2e8f0;text-decoration:none;color:inherit\" style-hover=\"outline:2px solid oklch(0.45 0.09 200)\">\n<img src=\"1efea78e-e116-4175-871c-569bb32dbfca\" alt=\"ABA vertical build\" style=\"width:100%;height:150px;object-fit:cover;object-position:top center;display:block;border-bottom:1px solid #e2e8f0\">\n<span style=\"padding:12px 14px 4px;font-size:14px;font-weight:700;color:#152029;line-height:1.3\">ABA vertical build<\u002Fspan>\n<span style=\"padding:0 14px 13px;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#94a3b8\">External · ABA practices<\u002Fspan>\n<\u002Fa>\n\n<article id=\"analytics\" style=\"grid-column:1/-1;background:#f7fafc;outline:1px solid #e2e8f0;border-left:3px solid oklch(0.45 0.09 200);padding:20px 24px;display:flex;flex-wrap:wrap;gap:26px;justify-content:space-between;scroll-margin-top:74px\">\n<div style=\"flex:1 1 380px;display:flex;flex-direction:column;gap:9px\">\n<h3 style=\"margin:0;font-size:18px;font-weight:700;color:#152029;line-height:1.25\">GeneID Analytics Dashboard<\u002Fh3>\n<p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#334155;text-wrap:pretty\">Built the reporting layer myself rather than waiting on a data team. Pulls submissions, insurance verification, and lab approvals into one view, then breaks performance down by state, account manager, account, and individual specialist. Includes an outreach calendar, per-account drill-downs, and an Insights-only mode for isolating the AI product's contribution. This is what replaced the manual spreadsheet roll-up, and it is where the forecast now comes from.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:0 1 200px;display:flex;flex-direction:column;gap:11px;padding-top:4px\">\n<div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:10.5px;letter-spacing:0.07em;text-transform:uppercase;color:#94a3b8\">Coverage<\u002Fspan><span style=\"font-size:13.5px;color:#334155\">Jan–Aug 2026, multi-state<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:10.5px;letter-spacing:0.07em;text-transform:uppercase;color:#94a3b8\">Views<\u002Fspan><span style=\"font-size:13.5px;color:#334155\">Overview · Insights · Territory · Account managers · Specialists · Outreach calendar<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:10.5px;letter-spacing:0.07em;text-transform:uppercase;color:#94a3b8\">Access<\u002Fspan><span style=\"font-size:13.5px;color:#334155\">Redacted demo on request<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px\">\n<figure style=\"margin:0;display:flex;flex-direction:column;gap:0;background:#ffffff;outline:1px solid #e2e8f0\">\n<img src=\"2ff98abc-6f7b-44d6-a5ba-12cd47d3b1ae\" alt=\"Analytics dashboard\" style=\"width:100%;height:auto;display:block;display:block;border-bottom:1px solid #e2e8f0\">\n<figcaption style=\"padding:12px 14px 13px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:14px;font-weight:700;color:#152029;line-height:1.3\">Analytics dashboard<\u002Fspan><span style=\"font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#94a3b8\">Internal · Names anonymized<\u002Fspan><\u002Ffigcaption>\n<\u002Ffigure>\n<figure style=\"margin:0;display:flex;flex-direction:column;gap:0;background:#ffffff;outline:1px solid #e2e8f0\">\n<img src=\"f5696842-f376-4490-a12b-dcdd3c380b8b\" alt=\"Account &amp; specialist performance\" style=\"width:100%;height:auto;display:block;display:block;border-bottom:1px solid #e2e8f0\">\n<figcaption style=\"padding:12px 14px 13px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:14px;font-weight:700;color:#152029;line-height:1.3\">Account &amp; specialist performance<\u002Fspan><span style=\"font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#94a3b8\">Internal · Accounts anonymized<\u002Fspan><\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fdiv>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"priority\" style=\"margin-top:28px;background:#ffffff;border:1px solid #e2e8f0;border-top:3px solid oklch(0.45 0.09 200);padding:22px 26px 24px;display:flex;flex-direction:column;gap:18px;scroll-margin-top:74px\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:18px;justify-content:space-between\">\n<div style=\"display:flex;flex-direction:column;gap:3px\">\n<h2 style=\"margin:0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:26px;line-height:1.15;color:#152029\">What's most important to you?<\u002Fh2>\n<p style=\"margin:0;font-size:13px;color:#64748b\">Optional shortcut — jump straight to the numbers and artifacts for one area.<\u002Fp>\n<\u002Fdiv>\n<sc-raw-select value=\"{{ priority }}\" sc-camel-on-change=\"{{ onSelectPriority }}\" aria-label=\"Choose a priority\" style=\"font-family:'Public Sans',Helvetica,sans-serif;font-size:14px;font-weight:600;color:#152029;background:#f7fafc;border:1px solid oklch(0.45 0.09 200);border-radius:2px;padding:11px 14px;min-width:220px;cursor:pointer\">\n<option value=\"\">Select a priority…<\u002Foption>\n<option value=\"sales\">Sales<\u002Foption>\n<option value=\"operations\">Operations<\u002Foption>\n<option value=\"training\">Training<\u002Foption>\n<option value=\"sops\">SOPs<\u002Foption>\n<option value=\"kpis\">KPIs<\u002Foption>\n<option value=\"scalability\">Scalability<\u002Foption>\n<option value=\"management\">Management<\u002Foption>\n<\u002Fsc-raw-select>\n<\u002Fdiv>\n<sc-if value=\"{{ hasPriority }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:16px;padding-top:4px;border-top:1px solid #e2e8f0\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1px;background:#e2e8f0;border:1px solid #e2e8f0;margin-top:14px\">\n<sc-for list=\"{{ bullets }}\" as=\"bullet\" hint-placeholder-count=\"2\">\n<div style=\"background:#f7fafc;padding:16px 18px;font-size:14.5px;line-height:1.5;color:#152029;font-weight:600;text-wrap:pretty\">{{ bullet }}<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:9px;align-items:center\">\n<span style=\"font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#94a3b8;margin-right:2px\">See the proof<\u002Fspan>\n<sc-for list=\"{{ proofs }}\" as=\"proof\" hint-placeholder-count=\"3\">\n<a href=\"{{ proof.href }}\" target=\"{{ proof.target }}\" rel=\"noopener\" sc-camel-on-click=\"{{ proof.onClick }}\" style=\"font-size:12.5px;font-weight:600;padding:8px 15px;border:1px solid oklch(0.45 0.09 200);border-radius:999px;color:oklch(0.45 0.09 200);cursor:pointer\" style-hover=\"background:oklch(0.45 0.09 200);color:#f7fafc\">{{ proof.label }}<\u002Fa>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsection>\n\n<section style=\"margin-top:52px\">\n<div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:7px;border-bottom:1px solid #e2e8f0\">\n<h2 style=\"margin:0;font-size:11.5px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:oklch(0.45 0.09 200);scroll-margin-top:74px\" id=\"achievements\">Achievements, and the work behind them<\u002Fh2>\n<span style=\"font-size:12px;color:#94a3b8\">Four outcomes, with the artifacts that produced them<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:1px;background:#e2e8f0;border:1px solid #e2e8f0\">\n\n<article style=\"background:#f7fafc;padding:24px 26px;display:flex;flex-wrap:wrap;gap:26px\">\n<div style=\"flex:1 1 380px;display:flex;flex-direction:column;gap:9px\">\n<span style=\"font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#94a3b8\">01 &nbsp;·&nbsp; Product launch<\u002Fspan>\n<h3 style=\"margin:0;font-size:20px;font-weight:700;color:#152029;line-height:1.25\">Took an AI patient-identification platform to market<\u002Fh3>\n<p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#334155;text-wrap:pretty\">Led commercial development and launch of GeneID Insights, which reads clinical data to surface patients who already meet medical necessity criteria for genetic testing, then routes that signal into provider engagement. I owned positioning, pricing framing, the full collateral set, and first-wave field adoption.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:3px\">\n<a href=\"https://jesssubirats.github.io/geneidinsights/\" target=\"_blank\" rel=\"noopener\" style=\"font-size:12px;font-weight:600;letter-spacing:0.04em;padding:6px 12px;border:1px solid oklch(0.45 0.09 200)\">GeneID Insights hub →<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:0 1 190px;display:flex;flex-direction:column;gap:11px;padding-top:26px\">\n<div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:10.5px;letter-spacing:0.07em;text-transform:uppercase;color:#94a3b8\">Scope<\u002Fspan><span style=\"font-size:13.5px;color:#334155\">Positioning through field enablement<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:10.5px;letter-spacing:0.07em;text-transform:uppercase;color:#94a3b8\">Evidence<\u002Fspan><span style=\"font-size:13.5px;color:#334155\">One-pager, brochure, FAQ, Insights dashboard view<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"background:#f7fafc;padding:24px 26px;display:flex;flex-wrap:wrap;gap:26px\">\n<div style=\"flex:1 1 380px;display:flex;flex-direction:column;gap:9px\">\n<span style=\"font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#94a3b8\">02 &nbsp;·&nbsp; Systems<\u002Fspan>\n<h3 style=\"margin:0;font-size:20px;font-weight:700;color:#152029;line-height:1.25\">Built the commercial data backbone from an empty account<\u002Fh3>\n<p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#334155;text-wrap:pretty\">HubSpot architecture, workflows, and forecasting across 36,000+ provider organizations and 47,000+ clinicians, built from an empty account. The provider universe was assembled from Alpha Sophia and IQVIA data and enriched with contacts captured at conferences and networking events, then segmented into territories the field could actually work.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:3px\">\n<span style=\"font-size:12px;font-weight:600;letter-spacing:0.04em;padding:6px 12px;border:1px solid #e2e8f0;color:#64748b\">Alpha Sophia<\u002Fspan>\n<span style=\"font-size:12px;font-weight:600;letter-spacing:0.04em;padding:6px 12px;border:1px solid #e2e8f0;color:#64748b\">IQVIA<\u002Fspan>\n<span style=\"font-size:12px;font-weight:600;letter-spacing:0.04em;padding:6px 12px;border:1px solid #e2e8f0;color:#64748b\">Conference &amp; networking capture<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:0 1 190px;display:flex;flex-direction:column;gap:11px;padding-top:26px\">\n<div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:10.5px;letter-spacing:0.07em;text-transform:uppercase;color:#94a3b8\">Scale<\u002Fspan><span style=\"font-size:13.5px;color:#334155\">36,000+ organizations, 47,000+ clinicians<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:10.5px;letter-spacing:0.07em;text-transform:uppercase;color:#94a3b8\">Sources<\u002Fspan><span style=\"font-size:13.5px;color:#334155\">Alpha Sophia and IQVIA provider data, plus networking events<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"background:#f7fafc;padding:24px 26px;display:flex;flex-wrap:wrap;gap:26px\">\n<div style=\"flex:1 1 380px;display:flex;flex-direction:column;gap:9px\">\n<span style=\"font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#94a3b8\">03 &nbsp;·&nbsp; Hiring &amp; ramp<\u002Fspan>\n<h3 style=\"margin:0;font-size:20px;font-weight:700;color:#152029;line-height:1.25\">Doubled the national sales team in eight weeks, and cut ramp time 65%<\u002Fh3>\n<p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#334155;text-wrap:pretty\">Hired seven representatives out of 141 relevant candidates, then built the machinery that absorbed them: candidate-facing orientation pages so applicants self-select on the real job, four role-based training curricula with certification checkpoints, and a resource library that stopped field questions routing through management.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:3px\">\n<a href=\"https://jesssubirats.github.io/gts-candidates/\" target=\"_blank\" rel=\"noopener\" style=\"font-size:12px;font-weight:600;letter-spacing:0.04em;padding:6px 12px;border:1px solid oklch(0.45 0.09 200)\">GTS candidate hub →<\u002Fa>\n<a href=\"https://jesssubirats.github.io/SAM-candidates/\" target=\"_blank\" rel=\"noopener\" style=\"font-size:12px;font-weight:600;letter-spacing:0.04em;padding:6px 12px;border:1px solid oklch(0.45 0.09 200)\">SAM candidate hub →<\u002Fa>\n<span style=\"font-size:12px;font-weight:600;letter-spacing:0.04em;padding:6px 12px;border:1px solid #e2e8f0;color:#64748b\">5 internal training hubs, described below<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:0 1 190px;display:flex;flex-direction:column;gap:11px;padding-top:26px\">\n<div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:10.5px;letter-spacing:0.07em;text-transform:uppercase;color:#94a3b8\">Funnel<\u002Fspan><span style=\"font-size:13.5px;color:#334155\">141 candidates, 7 hires, 2 months<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:10.5px;letter-spacing:0.07em;text-transform:uppercase;color:#94a3b8\">Evidence<\u002Fspan><span style=\"font-size:13.5px;color:#334155\">2 candidate hubs, 5 training properties<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"background:#f7fafc;padding:24px 26px;display:flex;flex-wrap:wrap;gap:26px\">\n<div style=\"flex:1 1 380px;display:flex;flex-direction:column;gap:9px\">\n<span style=\"font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#94a3b8\">04 &nbsp;·&nbsp; Provider adoption<\u002Fspan>\n<h3 style=\"margin:0;font-size:20px;font-weight:700;color:#152029;line-height:1.25\">Opened 113 ordering accounts and shortened provider go-live to seven days<\u002Fh3>\n<p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#334155;text-wrap:pretty\">Every account is a full implementation of the embedded-specialist model, not a signature: a genetic testing specialist placed inside the practice, screening patients against medical criteria. Implementation dropped from three weeks to seven days once the provider, patient, and co-marketing pages did the explaining. Patient-facing material ships in English and Spanish, because a third of the patients it reaches read Spanish first.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:3px\">\n<a href=\"https:/ lay:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:7px;border-bottom:1px solid #e2e8f0\">\n<h2 style=\"margin:0;font-size:11.5px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:oklch(0.45 0.09 200);scroll-margin-top:74px\" id=\"management\">How I manage<\u002Fh2>\n<span style=\"font-size:12px;color:#94a3b8\">In my own words<\u002Fspan>\n<\u002Fdiv>\n<div style=\"border:1px solid #e2e8f0;border-left:3px solid oklch(0.45 0.09 200);background:#ffffff;padding:26px 28px;display:flex;flex-wrap:wrap;gap:30px;align-items:flex-start\">\n<p style=\"margin:0;flex:0 1 300px;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:30px;line-height:1.15;color:#152029\">I lead with intention.<\u002Fp>\n<div style=\"flex:1 1 380px;display:flex;flex-direction:column;gap:14px;font-size:14.5px;line-height:1.6;color:#334155\">\n<p style=\"margin:0;text-wrap:pretty\">I believe high performance and healthy boundaries can coexist. I work hard, set a high standard, and expect accountability from my team — while respecting that great people do their best work when their time outside of work is respected.<\u002Fp>\n<p style=\"margin:0;text-wrap:pretty\">I value work ethic, coachability, and clear communication. My responsibility as a leader is to create clarity: clear expectations, attainable goals, defined ownership, and strong communication across teams so people know what success looks like and have a realistic path to achieve it.<\u002Fp>\n<p style=\"margin:0;text-wrap:pretty\">I also believe goals should challenge people, not set them up to fail. When leaders create unrealistic expectations — for themselves or their teams — I’m willing to course-correct. Ambition matters, but sustainable performance comes from setting meaningful targets, measuring progress, and adjusting when the data tells us something needs to change.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"margin-top:52px\">\n<div styl nt-weight:600;letter-spacing:0.06em;text-transform:uppercase\">View →<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#f7fafc;padding:15px 20px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;justify-content:space-between\">\n<div style=\"flex:1 1 400px;display:flex;flex-direction:column;gap:3px\">\n<span style=\"font-size:14.5px;font-weight:700;color:#152029;line-height:1.3\">AI-produced training videos<\u002Fspan>\n<span style=\"font-size:13px;line-height:1.5;color:#334155;text-wrap:pretty\">Onboarding and field-education modules built in Synthesia: scripting, storyboarding, and production in-house, so repeatable training could scale across a distributed team without booking studio time.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:0 1 auto;display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#94a3b8\">\n<span>Internal · Reps &amp; specialists<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:1px;background:#e2e8f0;border:1px solid #e2e8f0;margin-top:18px\">\n<button type=\"button\" sc-camel-on-click=\"{{ togglePrint }}\" aria-expanded=\"{{ openPrint }}\" style=\"background:#ffffff;border:none;border-bottom:1px solid #e2e8f0;padding:15px 20px;width:100%;display:flex;align-items:center;gap:14px;justify-content:space-between;cursor:pointer;font-family:'Public Sans',Helvetica,sans-serif;text-align:left\" style-hover=\"background:#eef4f7\" style-focus=\"outline:2px solid oklch(0.45 0.09 200);outline-offset:-2px\">\n<span style=\"font-size:12.5px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.45 0.09 200)\">Print &amp; sales collateral<\u002Fspan>\n<span style=\"display:flex;align-items:center;gap:12px\"><span style=\"font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#94a3b8\">5 items<\u002Fspan><span style=\"font-size:15px;line-height:1;color:oklch(0.45 0.09 200);width:14px;text-align:center\">{{ chevPrint }}<\u002Fspan><\u002Fspan>\n<\u002Fbutton>\n<sc-if value=\"{{ openPrint }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:1px\">\n<div id=\"card-sam-playbook\" style=\"background:#f7fafc;padding:15px 20px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;justify-content:space-between;scroll-margin-top:88px\">\n<div style=\"flex:1 1 400px;display:flex;flex-direction:column;gap:3px\">\n<span style=\"font-size:14.5px;font-weight:700;color:#152029;line-height:1.3\">SAM Playbook<\u002Fspan>\n<span style=\"font-size:13px;line-height:1.5;color:#334155;text-wrap:pretty\">A provider meeting scripted end to end: eight timed steps, a 30-second pitch, discovery questions, the three hurdles, and a close that never ends without a follow-up time.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:0 1 auto;display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#94a3b8\">\n<span>Internal · Print + digital<\u002Fspan><a href=\"https://drive.google.com/file/d/1erBVLhMuwO-u8Kcw3qrKrGdVcAH1IC2z/view?usp=sharing\" target=\"_blank\" rel=\"noopener\" style=\"font-weight:600;letter-spacing:0.06em;text-transform:uppercase\">View →<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div id=\"card-cheatsheets\" style=\"background:#f7fafc;padding:15px 20px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;justify-content:space-between;scroll-margin-top:88px\">\n<div style=\"flex:1 1 400px;display:flex;flex-direction:column;gap:3px\">\n<span style=\"font-size:14.5px;font-weight:700;color:#152029;line-height:1.3\">Field cheat sheets<\u002Fspan>\n<span style=\"font-size:13px;line-height:1.5;color:#334155;text-wrap:pretty\">HBOC/BRCA and Lynch criteria mapped against NCCN, Carelon, and Medicare policy; plus the bilingual patient opening script and privacy rules.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:0 1 auto;display:flex erformers promoted into senior sales and leadership roles'\n    ],\n    proofs: [\n      { label: 'Hiring & Training Hub', target: 'card-hiring-training' },\n      { label: 'Sales & Marketing Hub', target: 'card-sales-marketing' }\n    ]\n  }\n};\n\nconst ROLE_KEYS = ['Rvp', 'Rsd', 'Dsm', 'Am', 'Hc', 'Ms'];\nconst CAT_KEYS = ['Rec', 'Onb', 'Prov', 'Print', 'Vid'];\nconst CARD_GROUP = {\n  'card-hiring-training': 'Rec', 'card-gts-candidates': 'Rec', 'card-sam-candidates': 'Rec',\n  'card-sales-marketing': 'Onb', 'card-sam-newhire': 'Onb', 'card-1099-training': 'Onb',\n  'card-gts-training': 'Onb', 'card-gts-library': 'Onb',\n  'card-sam-playbook': 'Print', 'card-cheatsheets': 'Print'\n};\n\n\nclass Component extends DCLogic {\n  state = { priority: '', showTop: false, openRoles: { Rvp: true }, openCats: {} };\n\n  toggleCat(key) {\n    this.setState(s => ({ openCats: { ...s.openCats, [key]: !s.openCats[key] } }));\n  }\n\n  toggleRole(key) {\n    this.setState(s => ({ openRoles: { ...s.openRoles, [key]: !s.openRoles[key] } }));\n  }\n\n  componentDidMount() {\n    this.onScroll = () => {\n      const past = window.scrollY > 500;\n      if (past !== this.state.showTop) this.setState({ showTop: past });\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    this.onScroll();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this.onScroll);\n  }\n\n  tweenTo(target) {\n    const doc = document.documentElement;\n    const start = window.scrollY || doc.scrollTop || 0;\n    const max = Math.max(0, doc.scrollHeight - window.innerHeight);\n    const end = Math.max(0, Math.min(target, max));\n    const dist = end - start;\n    if (Math.abs(dist) < 2) { doc.scrollTop = end; return; }\n    const dur = Math.min(700, 220 + Math.abs(dist) * 0.25);\n    const t0 = performance.now();\n    cancelAnimationFrame(this._raf);\n    const step = (now) => {\n      const p = Math.min(1, (now - t0) / dur);\n      const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;\n      const y = start + dist * e;\n      doc.scrollTop = y;\n      window.scrollTo(0, y);\n      if (p < 1) this._raf = requestAnimationFrame(step);\n    };\n    this._raf = requestAnimationFrame(step);\n  }\n\n  scrollToId(id) {\n    const g = CARD_GROUP[id];\n    if (g && !this.state.openCats[g]) {\n      this.setState(s => ({ openCats: { ...s.openCats, [g]: true } }));\n      setTimeout(() => this.scrollToId(id), 60);\n      return;\n    }\n    const el = document.getElementById(id);\n    if (!el) return;\n    const y = el.getBoundingClientRect().top + window.scrollY - 28;\n    this.tweenTo(y);\n    const prev = el.style.outline;\n    const prevOffset = el.style.outlineOffset;\n    el.style.transition = 'outline-color 250ms ease';\n    el.style.outline = '2px solid oklch(0.45 0.09 200)';\n    el.style.outlineOffset = '-2px';\n    clearTimeout(el.__flashTimer);\n    el.__flashTimer = setTimeout(() => {\n      el.style.outline = prev;\n      el.style.outlineOffset = prevOffset;\n    }, 1800);\n  }\n\n  renderVals() {\n    const email = this.props.contactEmail ?? 'jess.subirats@gmail.com';\n    const entry = PRIORITIES[this.state.priority];\n    const proofs = (entry ? entry.proofs : []).map((p, i) => ({\n      label: p.label,\n      href: p.external ? p.href : '#' + p.target,\n      target: p.external ? '_blank' : '_self',\n      onClick: p.external ? () => {} : (e) => { e.preventDefault(); this.scrollToId(p.target); }\n    }));\n    const roleVals = {};\n    ROLE_KEYS.forEach(k => {\n      const open = !!this.state.openRoles[k];\n      roleVals['open' + k] = open;\n      roleVals['mark' + k] = open ? '–' : '+';\n      roleVals['toggle' + k] = () => this.toggleRole(k);\n    });\n    const catVals = {};\n    CAT_KEYS.forEach(k => {\n      const open = !!this.state.openCats[k];\n      catVals['open' + k] = open;\n      catVals['chev' + k] = open ? '▾' : '▸';\n      catVals['toggle' + k] = () => this.toggleCat(k);\n    });\n    return {\n      ...roleVals,\n      ...catVals,\n      contactEmail: email,\n      requestUrl: this.props.requestFormUrl ?? 'https://tally.so/r/lbkZDo',\n      linkedinUrl: this.props.linkedinUrl ?? 'https://www.linkedin.com/in/jessica-subirats-44632a78/',\n      priority: this.state.priority,\n      hasPriority: !!entry,\n      bullets: entry ? entry.bullets : [],\n      proofs,\n      onSelectPriority: (e) => this.setState({ priority: e.target.value }),\n      showTop: this.state.showTop,\n      backToTop: () => this.tweenTo(0)\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
